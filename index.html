<!-- ════════════════════════════════════════════════════════════════════════
     THE FRONT DOOR · 2026-10-05
     I said: "when you go [to trailer-load.com], is it not the game main menu? because it
     should be." The splash that lived here (wordmark, PLAY, today's wall, three counters)
     was a screen between the visitor and the game. This page now forwards to the game's
     main menu before anything renders. Its links moved onto the menu itself; pricing and
     the long marketing copy stay at /programs/.
     The visit counter is kept: once per tab session it bumps the single integer that the
     privacy policy describes (keepalive, so the request survives the page change). No row,
     no cookie, no IP. Deep links (#daily, #shift, #training, #crew) carry through.
     ════════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  try{
    var counted=false;
    try{counted=sessionStorage.getItem('liVisited')==='1';}catch(e){}
    if(!counted){
      try{sessionStorage.setItem('liVisited','1');}catch(e){}
      // 3.9.1007 the site's own /api (the LOCK IN API); it was a hosted database, with a public key in the page
      fetch('/api/rpc/visit',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},body:'{}'}).catch(function(){});
    }
  }catch(e){}
  try{location.replace('/lock-in.html'+(location.hash||''));}catch(e){location.href='/lock-in.html';}
})();
</script>
