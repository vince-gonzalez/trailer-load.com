<!--
  LOCK IN COMPANION FAMILY v1 · the one source for the header, stat bar, clipboard menus, buttons and footer
  that every LOCK IN companion game wears (Smalls Sort at /ss/). VAN STACK wore it too and left trailer-load.com
  in v3.5.208 as Vince's own game; it keeps its own copy of the blocks.

  Vince, 2026-10-17: "a sweep to make smalls sort and van stack in the same menu/header/etc. family - full sweep."

  HOW IT WORKS
  1. Paste the CSS block (from the FAMILY CSS marker to the END marker) into the page's <style>, unchanged.
  2. Paste the JS block (from the FAMILY JS marker to the END marker) into the page's <script>, unchanged.
     The crew chip reads the game's crew membership (liPlayer.crew); there are no player accounts (4.0).
     byte-identical to the copies in lock-in.html, me/, dashboard/ and ss/ (.tools/authblock.py).
  3. Load the LOCK IN fonts in <head>: <link rel="stylesheet" href="/fonts/fonts.css">
  4. Set the page's own accent, OUTSIDE the block, matching its Mini-Games card in lock-in.html:
       Smalls Sort  :root{--co-accent:#3aa0c0;--co-accent-deep:#1a6a8a;}
       VAN STACK    :root{--co-accent:#e8891c;--co-accent-deep:#a84f00;}
     --co-accent is the stripe under the header (decorative). --co-accent-deep is the fill of the main
     button on the clipboard, white text on it: #1a6a8a 6.05:1, #a84f00 5.55:1.
  5. Use the markup below. Game-specific buttons go in .co-actions before the back link, as .co-btn.
  6. Boot the account chip once the page is ready: coFamilyBoot(AUTH_URL, ANON_KEY);
  .tools/familyblock.py refuses a ship unless every companion carries both blocks byte-identical to this file
  and the markup contract below.

  MARKUP CONTRACT
  <header class="co-hdr">
    <div class="co-logo">GAME NAME<span class="co-kicker">LOCK IN COMPANION</span></div>   (not a link: a tap mid-run would reload the game)
    <nav class="co-actions" aria-label="GAME NAME">
      <span class="co-acct" id="co-acct"></span>
      <button type="button" class="co-btn">...</button>            (the game's own controls)
      <a class="co-btn co-back" href="/lock-in.html#minigames">← LOCK IN</a>
    </nav>
  </header>
  <div class="co-stats" aria-label="GAME NAME stats">
    <div class="co-stat"><span class="co-lbl">Label</span><span class="co-val" id="...">0</span></div>
  </div>
  Menus (start, end, settings, boards) sit on the LOCK IN clipboard:
  <div class="co-clip"><div class="co-clip-in">
    <h2 class="co-title">MENU NAME</h2><p class="co-sub">One line under it.</p>
    <div class="co-sheet">rules, results, a board: anything with rows sits on a sheet</div>
    ...
    <div class="co-row"><button type="button" class="co-cta">Main action</button><button type="button" class="co-btn2">Other</button></div>
  </div></div>
  <footer class="co-ftr">GAME NAME · a LOCK IN companion · <a href="/">trailer-load.com</a><br>www.f-keys.com | © 2026 F-Keys LLC</footer>

  MEASURED (WCAG AA, on the rendered pixels where the background is a picture)
  header bar #3d3a36 to #2b2926: logo amber #e0962e 4.6:1 or better (large text, needs 3), kicker and dim text
  #c9bba5 6.0:1 or better, signed-in green #69db7c 8.4:1. Stat bar: label #c9bba5 7.2:1, value amber 5.5:1.
  Clipboard paper (grey 148 to 196): ink #2a1a08 5.54:1 or better, dim ink #33230c 4.99:1 or better.
-->

<style>
/* ═══ LOCK IN COMPANION FAMILY v1 · CSS ═══ (byte-identical in every companion; .tools/familyblock.py) */
:root{
  --co-bar1:#3d3a36;--co-bar2:#2b2926;
  --co-ink:#f0e6d2;--co-dim:#c9bba5;
  --co-amber:#e0962e;--co-amber-hi:#f0ad4a;
  --co-ok:#69db7c;
  --co-paper-ink:#2a1a08;--co-paper-dim:#33230c;--co-paper-line:#8a7a62;
}
.co-hdr{position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:48px;padding:6px 14px;background:linear-gradient(180deg,var(--co-bar1),var(--co-bar2));
  border-bottom:3px solid var(--co-accent,var(--co-amber));box-shadow:0 2px 8px rgba(0,0,0,.4);}
.co-logo{display:inline-flex;align-items:baseline;gap:8px;flex:none;text-decoration:none;
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;line-height:1;color:var(--co-amber);
  text-shadow:0 1px 2px rgba(0,0,0,.5);}
.co-kicker{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--co-dim);text-shadow:none;}
.co-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.co-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;
  text-decoration:none;white-space:nowrap;color:var(--co-ink);background:rgba(0,0,0,.32);
  border:1.5px solid #6b5637;border-radius:6px;cursor:pointer;}
.co-btn:hover{background:rgba(0,0,0,.52);border-color:var(--co-amber);}
.co-btn[aria-pressed="true"]{border-color:var(--co-amber);color:var(--co-amber-hi);}
.co-btn.co-hot{background:var(--co-amber);border-color:var(--co-amber);color:#1a1208;}
.co-btn:disabled{opacity:.55;cursor:default;}
.co-acct{display:inline-flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:12px;
  letter-spacing:.5px;color:var(--co-dim);}
.co-acct .co-who{color:var(--co-ok);max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.co-logo:focus-visible,.co-btn:focus-visible,.co-cta:focus-visible,.co-btn2:focus-visible,.co-ftr a:focus-visible{
  outline:3px solid var(--co-amber-hi);outline-offset:2px;}
.co-stats{display:flex;flex-wrap:wrap;background:linear-gradient(180deg,#2e2e30,#262628);border-bottom:1px solid #1c1c1e;}
.co-stat{flex:1 1 0;min-width:68px;text-align:center;padding:4px 4px;border-right:1px solid #1e1e20;}
.co-stat:last-child{border-right:none;}
.co-lbl{display:block;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--co-dim);
  text-transform:uppercase;font-weight:bold;white-space:nowrap;}
.co-val{display:block;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1px;color:var(--co-amber);line-height:1.05;}
/* Menus sit on the LOCK IN clipboard (clipboard.png, 619x905), the way lock-in.html's menus do. The width drives the
   size so the picture and its writing area never drift apart; --co-clip-maxh is the tallest it may be. */
.co-clip{position:relative;flex:none;width:min(100%,619px,calc(var(--co-clip-maxh,86vh) * 0.684));aspect-ratio:619/905;
  background:url('/clipboard.png') center/100% 100% no-repeat;filter:drop-shadow(0 16px 42px rgba(0,0,0,.6));}
.co-clip-in{position:absolute;left:7%;right:7%;top:22.5%;bottom:4.5%;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  color:var(--co-paper-ink);font-family:'Barlow Condensed',sans-serif;font-size:16px;line-height:1.35;}
.co-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;line-height:1;color:var(--co-paper-ink);margin:0;}
.co-sub{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:1px;color:var(--co-paper-dim);margin:0;}
.co-clip-in p,.co-clip-in li{color:var(--co-paper-ink);}
/* A sheet laid on the clipboard: the same paper card as LOCK IN's Mini-Games menu (#f1ece0, a 7px tab in the accent).
   On the sheet: ink #2a1a08 14.3:1, dim #5a4526 7.7:1, good #1f6b32 5.5:1, warn #7a4a00 6.3:1, bad #a61e1e 6.3:1. */
.co-sheet,.co-note{width:100%;background:#f1ece0;color:var(--co-paper-ink);border:1px solid #cdbfa6;
  border-left:7px solid var(--co-accent-deep,#7d4a0e);border-radius:4px;box-shadow:0 1px 2px rgba(42,26,8,.14);padding:10px 12px;text-align:left;}
.co-note{font-family:'Share Tech Mono',monospace;font-size:12px;line-height:1.55;}
.co-sheet .co-dim,.co-note .co-dim{color:#5a4526;}
.co-good{color:#1f6b32;}.co-warn{color:#7a4a00;}.co-bad{color:#a61e1e;}
.co-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px;}
.co-cta,.co-btn2{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 20px;border-radius:6px;cursor:pointer;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;line-height:1;}
.co-cta{color:#fff;background:var(--co-accent-deep,#7d4a0e);border:1.5px solid var(--co-accent-deep,#7d4a0e);}
.co-btn2{color:var(--co-paper-ink);background:rgba(255,255,255,.35);border:1.5px solid var(--co-paper-ink);}
.co-cta:active,.co-btn2:active{transform:translateY(1px);}
.co-ftr{text-align:center;padding:8px 12px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;line-height:1.6;
  color:var(--co-dim);background:#262628;border-top:1px solid #1c1c1e;}
.co-ftr a{color:var(--co-dim);}
@media (max-width:560px){
  .co-hdr{padding:6px 10px;gap:6px;}
  .co-logo{font-size:22px;letter-spacing:2px;}
  .co-kicker{display:none;}
  .co-actions{gap:6px;}
  .co-btn{padding:0 8px;font-size:11px;}
  .co-title{font-size:26px;}
}
/* ═══ END COMPANION FAMILY CSS ═══ */
</style>

<script>
// ═══ LOCK IN COMPANION FAMILY v1 · JS ═══ (byte-identical in every companion; .tools/familyblock.py)
// The crew chip in the companion header. There are no player accounts (LOCK IN 4.0): the chip reads the crew membership
// the game keeps on this device (liPlayer.crew) and otherwise links to the game's crew panel.
function coEsc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';});}
function coCrew(){try{var p=JSON.parse(localStorage.getItem('liPlayer')||'null');return (p&&p.crew&&p.crew.token)?p.crew:null;}catch(e){return null;}}
function coAcctRender(){
  var el=document.getElementById('co-acct');if(!el)return;
  var c=coCrew();
  el.innerHTML=c?('<span class="co-who" title="On a crew">◆ '+coEsc(c.name)+'</span>'):'<a class="co-btn" href="/lock-in.html#crew">JOIN A CREW →</a>';
}
function coFamilyBoot(){ // READS: localStorage liPlayer · WRITES: #co-acct
  coAcctRender();
  try{
    window.addEventListener('storage',function(e){if(e.key===null||e.key==='liPlayer')coAcctRender();});
    window.addEventListener('pageshow',function(e){if(e.persisted)coAcctRender();});
  }catch(e){console.error('coFamilyBoot:',e);}
}
// ═══ END COMPANION FAMILY JS ═══
</script>
